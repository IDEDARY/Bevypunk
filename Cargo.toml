#======================#
#=== WORKSPACE INFO ===#

[workspace]
  members  = ["app", "crates/*"]
  resolver = "2"

[workspace.package]
  authors    = ["IDEDARY"]
  edition    = "2021"
  license    = "MIT OR Apache-2.0"
  repository = "https://github.com/idedary/bevypunk"
  version    = "0.0.1"

  #========================#
  #=== PROFILE SETTINGS ===#

[profile.dev]
  debug     = 0
  opt-level = 1
  strip     = "debuginfo"

[profile.dev.package."*"]
  opt-level = 3

[profile.release]
  codegen-units = 1
  debug         = 0
  lto           = "thin"
  opt-level     = 3
  panic         = 'abort'
  strip         = true

  #===============================#
  #=== DEPENDENCIES & FEATURES ===#

[workspace.dependencies]

  # GAME CRATES
  game_cameras     = { path = "crates/game_cameras" }
  game_loading     = { path = "crates/game_loading" }
  game_movies      = { path = "crates/game_movies" }
  game_preferences = { path = "crates/game_preferences" }
  game_vfx         = { path = "crates/game_vfx" }

  #===========================#
  #=== GAME ENGINE SOURCE === #

  # GAME ENGINE
  bevy = { version = "^0.16.1", default-features = false, features = [
    "animation",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gilrs",
    "bevy_gizmos",
    "bevy_gltf",
    "bevy_mesh_picking_backend",
    "bevy_pbr",
    "bevy_picking",
    "bevy_render",
    "bevy_scene",
    "bevy_sprite",
    "bevy_sprite_picking_backend",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_picking_backend",
    "bevy_window",
    "bevy_winit",
    "custom_cursor",
    "hdr",
    "jpeg",
    "multi_threaded",
    "png",
    "smaa_luts",
    "sysinfo_plugin",
    "tonemapping_luts",
    "webgl2",
    #"webgpu",
    "x11",
  ] }
  log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }

  #===============================#
  #=== GAME ENGINE EXTENSIONS === #

  # ASSETS
  bevy_embedded_assets = { version = "^0.13.0" }
  vleue_kinetoscope    = { git = "https://github.com/vleue/vleue_kinetoscope" }
  #bevy_embedded_assets = { git = "https://github.com/vleue/bevy_embedded_assets" }

  # AUDIO
  bevy_kira_audio = { version = "^0.23.0" }

  # USER INTERFACE
  bevy_lunex = { version = "^0.4.2", features = [] }

  # PHYSICS
  #avian3d = { version = "^0.2.1" }

  #===========================#
  #=== RUST MISCELLANEOUS === #

  # OTHER
  clap      = { version = "^4.5.48", features = ["derive"] }
  getrandom = { version = "0.3.3", features = ["wasm_js"] }
  rand      = { version = "^0.9.2" }
